# ═══════════════════════════════════════════════════════════════
# NotifySystem — Application Configuration
# Default profile: development (H2 in-memory)
# ═══════════════════════════════════════════════════════════════

# ─── Server ────────────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ─── DataSource (H2 — Development) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:notifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console (dev only — disable in production) ────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ───────────────────────────────────────────────────────
# IMPORTANT: Replace this secret with a strong random key in production!
# Generate with: openssl rand -base64 64
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration=86400000

# ─── Logging ───────────────────────────────────────────────────
logging.level.com.notifysystem=INFO
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── App Info ──────────────────────────────────────────────────
spring.application.name=NotifySystem
info.app.name=NotifySystem
info.app.version=1.0.0
info.app.description=Real-Time Notification System
