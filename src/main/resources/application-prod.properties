# ═══════════════════════════════════════════════════════════════
# NotifySystem — Production Configuration
# Activate with: --spring.profiles.active=prod
# ═══════════════════════════════════════════════════════════════

# ─── DataSource (PostgreSQL) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifydb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:notifyuser}
spring.datasource.password=${DB_PASSWORD:changeme}

# ─── Connection Pool (HikariCP) ────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── H2 Console (DISABLED in production) ───────────────────────
spring.h2.console.enabled=false

# ─── JWT (use env variable in production) ─────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Logging ───────────────────────────────────────────────────
logging.level.com.notifysystem=WARN
logging.level.root=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Actuator (restrict in prod) ───────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
